<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@400&display=swap" rel="stylesheet">

<body>

<div class="grain-overlay"></div>

<nav class="masthead-nav" id="masthead-nav">
  <div class="nav-mark" id="nav-mark">THE <span>DESIGN</span> TIMES</div>
  <ul class="nav-links">
    <li><a href="#" data-target="works">Works</a></li>
    <li><a href="#" data-target="about">About Me</a></li>

<!-- scroll length only; the visible content lives in .stage below -->
<div class="stage-spacer" id="stage-spacer"></div>

<div class="stage" id="stage">

  <header class="screen" id="screen-hero" data-i="0">
    <div class="hero-marquee" aria-hidden="true">
      <div class="marquee-row dir-left"><div class="marquee-track" id="marquee-row-1" style="animation-duration:38s;"></div></div>
      <div class="marquee-row dir-right"><div class="marquee-track" id="marquee-row-2" style="animation-duration:52s;"></div></div>
      <div class="marquee-row dir-left"><div class="marquee-track" id="marquee-row-3" style="animation-duration:33s;"></div></div>
    </div>
    <div class="hero-scrim" aria-hidden="true"></div>
    <div class="hero-content" id="hero-content">
      <div class="hero-kicker" id="hero-kicker">Est. 2024 — Vol. I</div>
      <h1 class="hero-title" id="hero-title">Name</h1>
      <div class="hero-role" id="hero-role">Role</div>
      <p class="hero-tagline" id="hero-tagline">Tagline</p>
    </div>
    <div class="scroll-cue" id="scroll-cue"><span>&#8595;</span>Scroll to read the story</div>
  </header>

  <section class="screen" id="screen-award" data-i="1">
    <div class="award-card article-card">
      <div class="award-ribbon" id="award-ribbon">Award</div>
      <div class="award-content">
        <div class="award-eyebrow" id="award-eyebrow">Breaking — Design News</div>
        <h2 class="award-headline" id="award-headline">Headline</h2>
        <div class="award-columns" id="award-columns"><!-- filled by JS --></div>

        </div>
      </div>
      <figure class="award-image">
        <div class="award-image-frame">

  <main style="display:contents;">
    <section class="screen" id="screen-works" data-i="2">
      <div class="screen-inner">
        <div class="works-card article-card">
          <div class="works-content">

            <div class="works-more">
              <a class="read-more-btn" id="works-read-more" href="works.html">Read More</a>

    <section class="screen" id="screen-about" data-i="3">
      <div class="screen-inner">
        <div class="article-card">

          <div class="section-title">About &amp; Expertise</div>
          <div class="section-rule"></div>

    </section>

    <section class="screen" id="screen-tools" data-i="4">
      <div class="screen-inner">
        <div class="article-card">
          <div class="section-eyebrow">Toolkit</div>
          <div class="section-title">Tools I Use</div>
          <div class="section-rule"></div>
          <div class="tools-grid" id="tools-grid"><!-- filled by JS --></div>
        </div>
      </div>
    </section>
  </main>

  <footer class="screen" id="screen-contact" data-i="5">
    <div class="screen-inner">
      <div class="article-card contact-card">
        <div class="contact-mark" id="contact-mark">The Design Times</div>
        <p class="contact-lede" id="contact-lede">Get in touch</p>
        <div class="contact-methods" id="contact-methods"><!-- filled by JS --></div>
        <div class="contact-socials" id="contact-socials"><!-- filled by JS --></div>
        <div class="fine-print" id="fine-print">&copy; Design Times</div>
      </div>
    </div>
  </footer>

</div>

<script src="config.js"></script>
<script>
/* ================================================================
   RENDER — builds the DOM from CONFIG (defined in config.js).
   No need to edit below unless you want to change structure/behaviour.
   ================================================================ */
document.getElementById('nav-mark').innerHTML = `THE <span>${CONFIG.maskheadShort}</span> TIMES`;
document.getElementById('hero-kicker').textContent = CONFIG.issueLine;
document.getElementById('hero-title').textContent = CONFIG.name;
document.getElementById('hero-role').textContent = CONFIG.role;
document.getElementById('hero-tagline').textContent = CONFIG.tagline;

// --- marquee background (blurred, decorative, behind hero text) ---
// Builds a strip of "article" placeholder cards for one row, then
// duplicates the strip once — that's what makes the infinite scroll
// loop seamlessly (translateX(-50%) lines up exactly with the start).
function buildMarqueeCard(){
  const lineCount = 2 + Math.floor(Math.random()*2);
  let inner = '<span class="mc-headline"></span>';
  for(let i=0;i<lineCount;i++){
    const short = (i === lineCount-1 && Math.random()>0.5) ? ' short' : '';
    inner += `<span class="mc-line${short}"></span>`;
  }
  return `<div class="marquee-card">${inner}</div>`;
}
function initHeroMarquee(){
  document.querySelectorAll('.marquee-track').forEach(track=>{
    let strip = '';
    for(let i=0;i<8;i++) strip += buildMarqueeCard();
    track.innerHTML = strip + strip; // duplicate for the seamless loop
  });
}
initHeroMarquee();

// --- award card ---
const A = CONFIG.award;
document.getElementById('award-ribbon').textContent = A.ribbon;
document.getElementById('award-eyebrow').textContent = A.eyebrow;
document.getElementById('award-headline').textContent = A.headline;
const awardCols = document.getElementById('award-columns');
awardCols.innerHTML = `
  <p><span class="award-dateline">${A.dateline}</span> ${A.excerpt}</p>
  <p class="no-cap">${A.excerpt2}</p>
`;
const readMoreBtn = document.getElementById('award-read-more');
let awardExpanded = false;
readMoreBtn.addEventListener('click', ()=>{
  awardExpanded = !awardExpanded;
  if(awardExpanded){
    const extra = document.createElement('div');
    extra.id = 'award-extra';
    extra.style.marginTop = '16px';
    extra.style.fontFamily = "var(--font-light)";
    extra.style.fontSize = '14px';
    extra.style.lineHeight = '1.6';
    extra.style.maxHeight = '30vh';
    extra.style.overflowY = 'auto';
    extra.innerHTML = A.fullText.map(p=>`<p style="margin-bottom:12px;">${p}</p>`).join('');
    document.querySelector('.award-content').insertBefore(extra, document.querySelector('.award-more'));
    readMoreBtn.textContent = 'Show Less';
  } else {
    const extra = document.getElementById('award-extra');
    if(extra) extra.remove();
    readMoreBtn.textContent = 'Read the Article';
  }
});

// --- award photo (uses a real photo if award.photo.url is set, otherwise a drawn placeholder) ---
const awardPhotoImg = document.getElementById('award-photo-img');
const awardPhotoPlaceholder = document.getElementById('award-photo-placeholder');
document.getElementById('award-photo-caption').textContent = A.photo.caption;
if(A.photo.url){
  awardPhotoImg.src = A.photo.url;
  awardPhotoImg.style.display = 'block';
  awardPhotoPlaceholder.style.display = 'none';
} else {
  awardPhotoPlaceholder.innerHTML = `
    <svg viewBox="0 0 100 125" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%;">
      <rect width="100" height="125" fill="var(--muted)"/>
      <circle cx="50" cy="40" r="18" fill="none" stroke="var(--ink)" stroke-width="4" opacity="0.85"/>
      <path d="M40 56 L30 92 L50 82 L70 92 L60 56" fill="var(--ink)" opacity="0.85"/>
    </svg>`;
}

// --- works card (article layout; "Read More" links to works.html) ---
const W = CONFIG.works;
document.getElementById('works-eyebrow').textContent = W.eyebrow;
document.getElementById('works-headline').textContent = W.headline;
document.getElementById('works-blurb').textContent = W.blurb;

// --- works photo (uses a real photo if works.photo.url is set, otherwise a drawn placeholder) ---
const worksPhotoImg = document.getElementById('works-photo-img');
const worksPhotoPlaceholder = document.getElementById('works-photo-placeholder');
document.getElementById('works-photo-caption').textContent = W.photo.caption;
if(W.photo.url){
  worksPhotoImg.src = W.photo.url;
  worksPhotoImg.style.display = 'block';
  worksPhotoPlaceholder.style.display = 'none';
} else {
  worksPhotoPlaceholder.innerHTML = `
    <svg viewBox="0 0 100 125" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%;">
      <rect width="100" height="125" fill="var(--muted)"/>
      <rect x="20" y="30" width="60" height="45" fill="none" stroke="var(--ink)" stroke-width="4" opacity="0.85"/>
      <circle cx="35" cy="45" r="6" fill="var(--ink)" opacity="0.85"/>
      <path d="M20 70 L42 52 L58 66 L80 46 L80 75 L20 75 Z" fill="var(--ink)" opacity="0.85"/>
    </svg>`;
}

// --- about + skills ---
document.getElementById('about-col').innerHTML = CONFIG.about.map(p=>`<p>${p}</p>`).join('');

// --- about photo (uses a real photo if aboutPhoto.url is set, otherwise a drawn placeholder) ---
const photoImg = document.getElementById('about-photo-img');
const photoPlaceholder = document.getElementById('about-photo-placeholder');
document.getElementById('about-photo-caption').textContent = CONFIG.aboutPhoto.caption;
if(CONFIG.aboutPhoto.url){
  photoImg.src = CONFIG.aboutPhoto.url;
  photoImg.style.display = 'block';
  photoPlaceholder.style.display = 'none';
} else {
  photoPlaceholder.innerHTML = `
    <svg viewBox="0 0 100 125" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%;">
      <rect width="100" height="125" fill="var(--muted)"/>
      <circle cx="50" cy="46" r="22" fill="var(--ink)" opacity="0.85"/>
      <path d="M10 125 C10 90 30 76 50 76 C70 76 90 90 90 125 Z" fill="var(--ink)" opacity="0.85"/>
    </svg>`;
}
document.getElementById('skills-col').innerHTML = CONFIG.skills.map(g=>`
  <div class="skill-group">
    <h4>${g.name}</h4>
    <ul class="skill-items">${g.items.map(i=>`<li>${i}</li>`).join('')}</ul>
  </div>
`).join('');

// --- tools (monochrome icons — a geometric mark for Figma, Adobe-style
// two-letter monogram badges for the Adobe apps, all in the ink color) ---
function toolIcon(logo){
  if(logo === 'figma'){
    return `<svg viewBox="0 0 16 24" style="width:32px;height:48px;">
      <path d="M0,8 L0,4 A4,4 0 0 1 8,4 L8,8 Z"/>
      <rect x="0" y="8" width="8" height="8"/>
      <path d="M0,16 L8,16 L8,20 A4,4 0 0 1 0,20 Z"/>
      <circle cx="12" cy="12" r="4"/>
      <circle cx="12" cy="20" r="4"/>
    </svg>`;
  }
  const monograms = { photoshop:'Ps', premiere:'Pr', aftereffects:'Ae' };
  return `<div class="tool-monogram">${monograms[logo] || '?'}</div>`;
}
document.getElementById('tools-grid').innerHTML = CONFIG.tools.map(t=>`
  <div class="tool-card">
    <div class="tool-icon">${toolIcon(t.logo)}</div>
    <div class="tool-name">${t.name}</div>
  </div>
`).join('');

// --- contact / footer ---
const C = CONFIG.contact;
document.getElementById('contact-mark').textContent = CONFIG.maskheadShort ? `The ${CONFIG.maskheadShort} Times` : 'Get in Touch';
document.getElementById('contact-lede').textContent = C.lede;
document.getElementById('contact-methods').innerHTML = `
  <a href="mailto:${C.email}">${C.email}</a>
  <span>${C.phone}</span>
  <span>${C.location}</span>
`;
document.getElementById('contact-socials').innerHTML = C.socials.map(s=>`<a href="${s.url}">${s.label}</a>`).join('');
document.getElementById('fine-print').textContent = C.finePrint;

/* ================================================================
   CARD-STACK SCROLL ENGINE
   Screens are numbered 0..N (hero=0). Screen i (i>=1) glides up
   over screen i-1 as the user scrolls through segment
   [(i-1)*L, i*L] of total scroll, and simply stacks on top of it —
   every screen is fully opaque, so the one underneath is hidden
   just by being physically covered, no fade or blur involved.
   Scrolling back up runs the exact same math in reverse, so each
   screen glides back down off the stack in order.
   ================================================================ */
const stage = document.getElementById('stage');
const spacer = document.getElementById('stage-spacer');
const nav = document.getElementById('masthead-nav');
const scrollCue = document.getElementById('scroll-cue');
const screens = Array.from(document.querySelectorAll('.screen'))
  .sort((a,b)=> +a.dataset.i - +b.dataset.i);

function getStopLen(){
  return parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--stop-vh')) * window.innerHeight;
}

function sizeSpacer(){
  const vh = window.innerHeight;
  const L = getStopLen();
  const transitions = screens.length - 1; // number of "glide in" transitions
  spacer.style.height = (transitions * L + vh) + 'px';
}
window.addEventListener('resize', sizeSpacer);
sizeSpacer();

const panelIndexMap = { works:2, about:3, contact:5 };
document.querySelectorAll('.nav-links a').forEach(link=>{
  link.addEventListener('click', (e)=>{
    e.preventDefault();
    const idx = panelIndexMap[link.dataset.target];
    const L = getStopLen();
    const maxScroll = Math.max(document.documentElement.scrollHeight - window.innerHeight, 0);
    const target = Math.min(idx * L, maxScroll);
    window.scrollTo({ top: target, behavior:'smooth' });
  });
});

function clamp01(v){ return Math.max(0, Math.min(1, v)); }

// Fast at the start, then eases off smoothly into place — no overshoot,
// no bounce, just a clean settle onto the stack.
function easeOutExpo(t){
  if(t <= 0) return 0;
  if(t >= 1) return 1;
  return 1 - Math.pow(2, -8 * t);
}

function updateStage(){
  const vh = window.innerHeight;
  const L = getStopLen();
  const localScroll = window.scrollY;

  screens.forEach((screen, i)=>{
    let p; // own "glide in" progress, 0..1 (raw scroll fraction)
    if(i === 0){
      p = 1; // hero is present from the start
    } else {
      const s = localScroll - (i-1)*L;
      p = clamp01(s / L);
    }
    const eased = easeOutExpo(p); // fast in, smooth settle — see easeOutExpo above
    const translateY = (1 - eased) * 100;
    const scaleEnter = 0.96 + 0.04 * eased; // a touch of pop as it settles into the stack

    screen.style.transform = `translate(-50%,-50%) translateY(${translateY}%) scale(${scaleEnter})`;
    screen.style.opacity = 1; // fully opaque — it simply stacks on top, no fading
    screen.style.zIndex = i + 1;

    // only the screen that has fully arrived (and isn't yet covered by
    // the next one) should be clickable
    let q = 0;
    if(i < screens.length - 1){
      const sNext = localScroll - i*L;
      q = clamp01(sNext / L);
    }
    screen.style.pointerEvents = (p > 0.6 && q < 0.4) ? 'auto' : 'none';
  });

  // hero scroll cue fades as the award screen starts covering it
  const heroQ = screens.length > 1 ? clamp01(localScroll / L) : 0;
  scrollCue.style.opacity = 1 - heroQ;

  nav.classList.toggle('scrolled', window.scrollY > 10);
}

function animate(){
  requestAnimationFrame(animate);
  updateStage();
}
requestAnimationFrame(animate);
</script>
</body>
</html>
